[pytest]
testpaths = tests
pythonpath = .
norecursedirs = worktrees TAPE
markers =
    gpu: requires the RX 7900 XT and a constructed ROCm environment
    integration: requires external media tools or real assets
    vapoursynth: Windows Python, VapourSynth, vsjetpack, native plugins, vspipe, and ffmpeg are required
    e2e: requires a real 29.97i VHS source and full long-run pipeline execution
